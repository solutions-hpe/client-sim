<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client-Sim Dashboard</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-content">
      <div>
        <h1>
          <span class="brand-name">HPE</span>
          Client-Sim Dashboard
        </h1>
      </div>
      <div class="ws-status" aria-live="polite">
        <span id="ws-dot" class="status-dot offline"></span>
        <span id="ws-text">Disconnected</span>
      </div>
    </div>
  </header>

  <main class="page">
    <section class="toolbar">
      <div class="toolbar-actions">
        <button id="kill-all" class="btn btn-danger" type="button">Kill All</button>
        <button id="resume-all" class="btn btn-secondary" type="button">Resume All</button>
      </div>
      <div id="client-count" class="count-badge">0 clients</div>
    </section>

    <section class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Status</th>
            <th>Hostname</th>
            <th>Platform</th>
            <th>Sim ID</th>
            <th>SSID</th>
            <th>Active Simulations</th>
            <th>Aruba Central Impact</th>
            <th>Iteration</th>
            <th>Last Seen</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="clients-body"></tbody>
      </table>
    </section>
  </main>

  <script src="/app.js" defer></script>

  <footer style="background:#1F2531;color:rgba(255,255,255,0.4);font-size:0.75rem;padding:8px 24px;display:flex;align-items:center;justify-content:space-between;">
    <span>© Hewlett Packard Enterprise · Client-Sim Dashboard</span>
    <span id="footer-version">v0.1</span>
  </footer>
</body>
</html>
