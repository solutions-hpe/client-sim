[simulation]
kill_switch=off
rapid_update=on
sim_load=100
github_repo=on
repo_location=https://github.com/solutions-hpe/client-sim/
repo_branch=lrb
smb_repo=off
vh_server=off
site_based_ssid=on
site_based_num=2
reboot_schedule=300
allow_offline=no
ssidpw_fail=off
auth_fail=off
dot1x_password=password
dot1x_eap=peap
iperf_bw=1k
syslog=on
web_server=on

[server]
server_url=http://169.253.1.1:8000

[address]
smb_address=//nas/scripts
ping_address=172.31.201.3
dns_latency_1=13.239.88.95
dns_latency_2=27.110.152.250
dns_latency_3=165.246.10.2
dns_bad_ip_1=10.0.0.1
dns_bad_ip_2=172.16.0.1
dns_bad_ip_3=192.168.0.1
dns_bad_record_1=172.31.201.1
dns_bad_record_2=172.31.202.2
dns_bad_record_3=100.100.0.1
iperf_server=172.31.201.135
syslog_server=169.253.1.5

[s0]
# central_check: set to the Aruba Central alert_type or insight category ID
# that should be firing when this simulation runs. Leave blank if not configured.
central_check=
wsite=DFW
ssid=PSK
ssidpw=PassW0rd!
dhcp_fail=off
dns_fail=on
assoc_fail=off
port_flap=off
ping_test=on
download=on
www_traffic=on
iperf=off
sim_phy=wireless
l1=no

