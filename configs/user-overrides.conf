# user-overrides.conf — Per-user simulation overrides
#
# Add a [username] section here to pin a specific client to a custom
# simulation profile regardless of which bucket (s0-s9) their VMID falls in.
#
# Any key set here takes precedence over the matching key in simulation.conf.
# Keys not listed here fall through to the bucket profile or global settings.
#
# Most deployments can leave this file as-is. Fork your branch and edit here
# to add site-specific overrides, then submit a PR for review.
#
# Example entry:
#   [jsmith]
#   dns_fail=on
#   wsite=LAX

#Device/User Specific Configurations
[slynch]
wsite=DFW
ssid=PSK
ssidpw=PassW0rd!
dhcp_fail=off
dns_fail=off
assoc_fail=off
ssidpw_fail=on
auth_fail=off
port_flap=off
ping_test=off
download=off
www_traffic=off
iperf=off
sim_phy=wireless
l1=no
smb_address=//nas/scripts
ping_address=172.31.201.1
dns_latency_1=13.239.88.95
dns_latency_2=27.110.152.250
dns_latency_3=165.246.10.2
dns_bad_ip_1=10.0.0.2
dns_bad_ip_2=172.16.0.2
dns_bad_ip_3=192.168.0.2
dns_bad_record_1=172.31.201.1
dns_bad_record_2=172.31.202.2
dns_bad_record_3=100.100.0.1
iperf_server=172.31.201.135
kill_switch=off
sim_load=100
github_repo=on
repo_location=https://github.com/solutions-hpe/client-sim/
repo_branch=lrb
site_based_ssid=on
site_based_num=2
reboot_schedule=300
iperf_bw=1k

