# ─── Client-Sim Installer Override Configuration ─────────────────────────────
# Branch: lrb (development / testing)
#
# This file is branch-specific. It is downloaded by the installer from the same
# GitHub branch the installer runs from. It does NOT exist in main/prod branches,
# so production installs are unaffected.
#
# Override variables are applied AFTER defaults but BEFORE CLI argument parsing,
# so explicit CLI args (--server, --hub-url, etc.) always take final precedence.
#
# ⚠  Do NOT put secrets (keys, passwords) here — this file is committed to git.
#    Pass sensitive values as CLI args or env vars instead.
# ─────────────────────────────────────────────────────────────────────────────

# Azure Blob Storage — dev store (West US 3, Shared resource group)
AZURE_ACCOUNT="csvmstorage"
# AZURE_CONTAINER="vms"   # same as default — uncomment to override

# Hub URL used for spoke bootstrap and SAS token fetching.
# Overrides the default only if --hub-url is NOT passed on the CLI.
# OVERRIDE_HUB_URL="http://dev-hub.example.com:8443"

# Tenant ID for hub bootstrap.
# Overrides the default only if --tenant-id is NOT passed on the CLI.
# OVERRIDE_TENANT_ID=""

# Spoke server URL.
# Overrides the default only if --server is NOT passed on the CLI.
# OVERRIDE_SERVER_URL="http://192.168.1.x:8000"

# GitHub branch to pull agent/watchdog from (default: lrb).
# REPO_BRANCH="lrb"
